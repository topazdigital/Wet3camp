name: Deploy to wet3.camp

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build frontend outside the memory-constrained server
        run: |
          pnpm install --frozen-lockfile
          PORT=19099 BASE_PATH=/ pnpm --filter "@workspace/wet3camp" run build
          test -s artifacts/wet3camp/dist/public/index.html
          asset_count="$(find artifacts/wet3camp/dist/public/assets -type f | wc -l)"
          test "$asset_count" -gt 0
          tar -czf wet3camp-frontend.tgz -C artifacts/wet3camp/dist/public .
          echo "Built and archived $asset_count frontend assets."

      - name: Upload frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 157.250.205.180
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          source: wet3camp-frontend.tgz
          target: /home/admin/wet3camp-build/

      - name: Deploy API and activate validated frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        with:
          host: 157.250.205.180
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 12m
          envs: DEPLOY_COMMIT
          script: |
            set -e
            git config --global --add safe.directory /home/admin/wet3camp-build 2>/dev/null || true
            rm -f /home/admin/wet3camp-build/.git/index.lock \
                  /home/admin/wet3camp-build/.git/config.lock \
                  /home/admin/wet3camp-build/.git/refs/heads/main.lock 2>/dev/null || true
            cd /home/admin/wet3camp-build
            git fetch origin main
            git checkout main
            git reset --hard "$DEPLOY_COMMIT"
            test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"
            rm -rf .frontend-prebuilt
            mkdir -p .frontend-prebuilt
            tar -xzf wet3camp-frontend.tgz -C .frontend-prebuilt
            rm -f wet3camp-frontend.tgz
            test -s .frontend-prebuilt/index.html
            test -n "$(find .frontend-prebuilt/assets -type f -name '*.js' -o -name '*.css' | head -1)"
            FRONTEND_PREBUILT_DIR="/home/admin/wet3camp-build/.frontend-prebuilt" \
              bash deploy-on-server.sh
            rm -rf .frontend-prebuilt
            echo "✅ Auto-deploy complete at $(date)"

      - name: Verify published frontend assets
        run: |
          set -e
          html="$(curl -fsSL https://wet3.camp/)"
          assets="$(printf '%s' "$html" | grep -oE '(src|href)="/assets/[^"]+"' | sed -E 's/^(src|href)="([^"]+)".*$/\2/' | sort -u)"
          test -n "$assets"
          while IFS= read -r asset; do
            content_type="$(curl -fsSIL https://wet3.camp"$asset" | tr -d '\r' | awk -F': ' 'tolower($1) == "content-type" { value=$2 } END { print tolower(value) }')"
            case "$asset" in
              *.js)
                case "$content_type" in
                  application/javascript*|text/javascript*) ;;
                  *) echo "Expected JavaScript for $asset, received: $content_type"; exit 1 ;;
                esac
                ;;
              *.css)
                case "$content_type" in
                  text/css*) ;;
                  *) echo "Expected CSS for $asset, received: $content_type"; exit 1 ;;
                esac
                ;;
            esac
            echo "Verified $asset ($content_type)"
          done <<< "$assets"

      - name: Ping IndexNow (Bing/Yandex instant indexing)
        run: |
          curl -s -X POST https://wet3.camp/api/seo/indexnow -o /tmp/indexnow.json || true
          cat /tmp/indexnow.json || true
