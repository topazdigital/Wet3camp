name: Deploy to wet3.camp

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy API and activate committed frontend build
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        with:
          host: 157.250.205.180
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 12m
          envs: DEPLOY_COMMIT
          script: |
            set -e
            git config --global --add safe.directory /home/admin/wet3camp-build 2>/dev/null || true
            rm -f /home/admin/wet3camp-build/.git/index.lock \
                  /home/admin/wet3camp-build/.git/config.lock \
                  /home/admin/wet3camp-build/.git/refs/heads/main.lock 2>/dev/null || true
            # Remove only disposable deployment leftovers before fetching.
            # Previous failed deploys left stale node_modules/dist/releases
            # behind, filling the disk and preventing git from writing a pack.
            find /home/admin/wet3camp-build -type d \
              \( -name 'node_modules' -o -name 'node_modules.stale.*' -o -name 'dist' \
              -o -name 'dist.stale.*' -o -name '.deploy-stale' \) \
              -prune -exec rm -rf {} + 2>/dev/null || true
            for stale in \
              /home/admin/wet3camp-build/node_modules.stale.* \
              /home/admin/wet3camp-build/artifacts/*/node_modules.stale.* \
              /home/admin/wet3camp-build/artifacts/*/dist.stale.*; do
              [ -e "$stale" ] || continue
              rm -rf "$stale" 2>/dev/null || true
            done
            find /home/admin/domains/wet3.camp -maxdepth 1 -type d \
              -name 'public_html.release.*' -prune -exec rm -rf {} + 2>/dev/null || true
            find /home/admin/.pm2/logs -type f -iname '*wet3camp*' \
              -exec truncate -s 0 {} + 2>/dev/null || true
            find /tmp -maxdepth 1 -type f \
              \( -name 'wet3camp-*' -o -name 'wet3camp*.log' \) \
              -delete 2>/dev/null || true
            cd /home/admin/wet3camp-build
            df -h /home/admin/wet3camp-build || true
            git fetch origin main
            git checkout main
            git reset --hard "$DEPLOY_COMMIT"
            test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"
            test -s artifacts/wet3camp/public-build/index.html
            test -n "$(find artifacts/wet3camp/public-build/assets -type f | head -1)"
            SKIP_DEPENDENCIES=1 SKIP_API_BUILD=1 bash deploy-on-server.sh
            rm -rf /home/admin/wet3camp-build/node_modules.stale.* \
              /home/admin/wet3camp-build/artifacts/*/node_modules.stale.* \
              /home/admin/wet3camp-build/artifacts/*/dist.stale.* 2>/dev/null || true
            df -h /home/admin/wet3camp-build || true
            echo "✅ Auto-deploy complete at $(date)"

      - name: Verify published frontend assets
        run: |
          set -e
          html="$(curl -fsSL https://wet3.camp/)"
          assets="$(printf '%s' "$html" | grep -oE '(src|href)="/assets/[^"]+"' | sed -E 's/^(src|href)="([^"]+)".*$/\2/' | sort -u)"
          test -n "$assets"
          while IFS= read -r asset; do
            content_type="$(curl -fsSIL https://wet3.camp"$asset" | tr -d '\r' | awk -F': ' 'tolower($1) == "content-type" { value=$2 } END { print tolower(value) }')"
            case "$asset" in
              *.js)
                case "$content_type" in
                  application/javascript*|text/javascript*) ;;
                  *) echo "Expected JavaScript for $asset, received: $content_type"; exit 1 ;;
                esac
                ;;
              *.css)
                case "$content_type" in
                  text/css*) ;;
                  *) echo "Expected CSS for $asset, received: $content_type"; exit 1 ;;
                esac
                ;;
            esac
            echo "Verified $asset ($content_type)"
          done <<< "$assets"

      - name: Ping IndexNow (Bing/Yandex instant indexing)
        run: |
          curl -s -X POST https://wet3.camp/api/seo/indexnow -o /tmp/indexnow.json || true
          cat /tmp/indexnow.json || true
